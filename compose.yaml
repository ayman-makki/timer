services:
  minuteur:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

volumes:
  sqlite-data:
